[package]
name = "hive-engine"
version = "0.5.1"
edition = "2021"
description = "Hive board game engine (base game), UHP move notation, WASM bindings"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[profile.test]
opt-level = 2
