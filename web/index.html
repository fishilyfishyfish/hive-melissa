<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1d2126">
  <title>Hive</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>Hive</h1>
    <div class="controls">
      <label class="field">
        <span>내 색</span>
        <select id="color">
          <option value="White">백 (선)</option>
          <option value="Black">흑 (후)</option>
        </select>
      </label>
      <label class="field">
        <span>AI</span>
        <select id="level">
          <option value="random">랜덤</option>
          <option value="easy">쉬움 (1수 앞)</option>
          <option value="normal">보통 (0.3초)</option>
          <option value="hard" selected>어려움 (1.5초)</option>
          <option value="max">최강 (5초)</option>
        </select>
      </label>
      <label class="field check">
        <input type="checkbox" id="tournament" checked>
        <span>토너먼트</span>
      </label>
      <button id="new">새 게임</button>
      <button id="undo">무르기</button>
      <button id="pass" disabled>패스</button>
      <button id="hint">힌트</button>
      <button id="fit" title="판 맞춤">맞춤</button>
      <button id="analyze">분석</button>
      <button id="study-btn" title="빈 판부터 흑백 둘 다 직접 두며 엔진 후보 수를 본다">탐구</button>
    </div>
  </header>

  <main class="layout">
    <section class="board-wrap">
      <div id="status" class="status">엔진 불러오는 중…</div>
      <svg id="board" role="img" aria-label="Hive board">
        <g id="world">
          <g id="cells"></g>
          <g id="targets"></g>
        </g>
      </svg>
    </section>

    <aside class="side">
      <div class="hand" id="hand-Black">
        <h2>흑<span class="full">&nbsp;손패</span></h2>
        <div class="pieces"></div>
      </div>
      <div class="hand" id="hand-White">
        <h2>백<span class="full">&nbsp;손패</span></h2>
        <div class="pieces"></div>
      </div>
      <section id="analysis" hidden>
        <div class="ana-head">
          <h2>분석</h2>
          <select id="ana-speed" title="한 수당 분석 시간">
            <option value="300">빠르게 (수당 0.3초)</option>
            <option value="1500">꼼꼼히 (수당 1.5초)</option>
          </select>
          <button id="ana-close" class="small">닫기</button>
        </div>
        <div id="ana-progress" class="ana-progress"></div>
        <svg id="ana-graph" viewBox="0 0 300 100" preserveAspectRatio="none" role="img" aria-label="형세 그래프"></svg>
        <div class="ana-legend"><span>위 = 백 유리</span><span>아래 = 흑 유리</span></div>
        <div class="ana-nav">
          <button id="ana-first" title="처음">⏮</button>
          <button id="ana-prev" title="이전 수">◀</button>
          <span id="ana-pos"></span>
          <button id="ana-next" title="다음 수">▶</button>
          <button id="ana-last" title="마지막">⏭</button>
        </div>
        <div id="ana-card" class="ana-card"></div>
        <ol id="ana-moves" class="ana-moves"></ol>
        <div class="ana-actions">
          <button id="ana-continue">여기서 이어 두기</button>
          <button id="ana-import">기보 불러오기</button>
          <button id="ana-export">기보 저장</button>
        </div>
      </section>
      <section id="study" hidden>
        <div class="ana-head">
          <h2>탐구</h2>
          <select id="study-speed" title="후보 계산 시간">
            <option value="1200">빠르게 (1.2초)</option>
            <option value="4000">꼼꼼히 (4초)</option>
          </select>
          <button id="study-close" class="small">닫기</button>
        </div>
        <div class="ana-nav">
          <button id="study-reset" title="빈 판으로">⏮</button>
          <button id="study-back" title="한 수 되돌리기">◀</button>
          <span id="study-pos"></span>
          <button id="study-fwd" title="되돌린 수 다시 두기">▶</button>
        </div>
        <div id="study-standing" class="study-standing"></div>
        <ul id="study-notes" class="study-notes"></ul>
        <div id="study-judge" class="ana-card" hidden></div>
        <h3 class="study-sub">좋은 수 후보 <span id="study-count"></span></h3>
        <ol id="study-cands" class="study-cands"></ol>
        <div class="ana-actions">
          <button id="study-ai">여기서 AI와 두기</button>
          <button id="study-import">기보 불러오기</button>
          <button id="study-copy">기보 복사</button>
        </div>
      </section>
      <div class="log">
        <h2>기보 <button id="copy" class="small">복사</button></h2>
        <ol id="moves"></ol>
      </div>
    </aside>
  </main>

  <script type="module" src="main.js"></script>
</body>
</html>
